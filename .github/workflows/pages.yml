name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9,21 * * *"   # coleta completa 2 vezes por dia (a coleta leva ~25 min)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependências do coletor
        run: pip install -r scanner/requirements.txt
      - name: Testes do coletor
        working-directory: scanner
        run: python -m unittest test_scanner
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes da lista e da comparação
        run: node --test tests/js/*.test.js
      - name: Restaurar os últimos preços (push não refaz a coleta de 25 min)
        uses: actions/cache@v4
        with:
          path: docs/data
          key: dados-${{ github.run_id }}
          restore-keys: dados-
      - name: Coleta dos preços e dos encartes
        working-directory: scanner
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            python scan.py --out ../docs/data/prices.json                      # agendada ou manual: coleta completa
          elif [ ! -f ../docs/data/prices.json ]; then
            python scan.py --out ../docs/data/prices.json --limit-terms 25     # 1º push, sem cache: coleta rápida só para o site subir
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
