server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Cache-Control "no-cache" always;   # o navegador sempre revalida (304 barato): nunca mistura arquivos de versões diferentes

  location /api/ {
    proxy_pass http://api:8081;
    proxy_read_timeout 180s;
  }
}
